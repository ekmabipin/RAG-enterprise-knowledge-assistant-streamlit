app:
  name: "NovaTech Enterprise Knowledge Assistant"
  environment: "development"

paths:
  data_dir: "data"
  vector_store_dir: "chroma_db"

llm:
  provider: "openai"
  model_name: "gpt-4.1-mini"
  temperature: 0.0
  max_tokens: 800

embeddings:
  provider: "openai"
  model_name: "text-embedding-3-small"

chunking:
  splitter: "recursive_character"
  chunk_size: 800
  chunk_overlap: 120

vector_store:
  type: "chroma"
  collection_name: "novatech_knowledge_base"
  persist_directory: "chroma_db"

retrieval:
  vector_top_k: 12
  bm25_top_k: 12
  hybrid_top_k: 20

hybrid_search:
  vector_weight: 0.6
  keyword_weight: 0.4

reranker:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 10

memory:
  enabled: true
  max_history_messages: 10

rag:
  max_context_chunks: 6
  return_sources: true
  hallucination_fallback: >
    I could not find this information in the available company documents.

logging:
  level: "INFO"
  

# source_priority:
#   leave_policy.pdf: 0.30
#   travel_policy.pdf: 0.30
#   it_security_policy.pdf: 0.30
#   employee_benefits.docx: 0.30
#   remote_work_policy.docx: 0.30
#   code_of_conduct.docx: 0.30
#   employee_handbook.pdf: 0.10
#   company_faq.txt: 0.00

final_ranking:
  rerank_weight: 0.60
  hybrid_weight: 0.30
  source_priority_weight: 0.10

source_priority:
  leave_policy.pdf: 1.0
  travel_policy.pdf: 1.0
  it_security_policy.pdf: 1.0
  employee_benefits.docx: 1.0
  remote_work_policy.docx: 1.0
  code_of_conduct.docx: 1.0
  employee_handbook.pdf: 0.5
  company_faq.txt: 0.2

final_selection:
  hybrid_keep_top_n: 5
  rerank_keep_top_n: 5
  max_context_chunks: 8